packages:
  - apps/*
  - packages/*

allowBuilds:
  # Downloads the sentry-cli binary in a postinstall — @sentry/vite-plugin needs it to upload source maps.
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true

verifyDepsBeforeRun: false


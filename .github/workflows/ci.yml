name: CI

# Quality gate for pull requests. Previews themselves are built natively by
# Vercel; production deployment lives in deploy-production.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only checks out and lints/type-checks the code.
permissions:
  contents: read

jobs:
  verify:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check (Biome)
        run: pnpm lint:ci

      - name: Type check
        run: pnpm check-types

      - name: Unused code & dependencies (Knip)
        run: pnpm knip

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Runs the full app locally on the runner — server + web + an isolated test
    # Postgres — exactly as `pnpm test:e2e` does on a dev machine. This is faster
    # and far more deterministic than driving the deployed Vercel preview: no
    # serverless cold starts, no Neon round-trip latency. playwright.config.ts
    # always runs locally: globalSetup stands up the test DB (docker compose, :8766
    # — Docker is preinstalled on ubuntu-latest) and seeds it, and webServer boots
    # the Hono server plus the web app served as a production build (vite build &&
    # preview).
    env:
      HUSKY: 0
      # The server validates these at boot (src/config/env.ts); the blob token must
      # be real because the photo specs upload to Vercel blob (no local emulator)
      # and assert the returned image renders. DATABASE_URL is supplied by
      # globalSetup/webServer (the test DB), so it is not set here.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      HOMEWISE_RESEND_API_KEY: ${{ secrets.HOMEWISE_RESEND_API_KEY }}
      HOMEWISE_FILES_READ_WRITE_TOKEN: ${{ secrets.HOMEWISE_FILES_READ_WRITE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @homewise/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @homewise/e2e test

      # Report + traces for debugging a failed run (traces captured on first retry).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
